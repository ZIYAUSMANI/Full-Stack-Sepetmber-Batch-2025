<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Bootstrap Only</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <div class="container mt-5">

        <div class="position-relative bg-light" style="height:300px;">

            <div class="bg-dark position-absolute top-0 start-0 translate-middle" style="width:30px; height:30px;">
            </div>
            <div class="bg-dark position-absolute top-0 start-50 translate-middle" style="width:30px; height:30px;">
            </div>
            <div class="bg-dark position-absolute top-0 end-0 translate-middle" style="width:30px; height:30px;"></div>
            <div class="bg-dark position-absolute top-50 start-0 translate-middle" style="width:30px; height:30px;">
            </div>
            <div class="bg-dark position-absolute top-50 start-50 translate-middle" style="width:30px; height:30px;">
            </div>
            <div class="bg-dark position-absolute top-50 end-0 translate-middle" style="width:30px; height:30px;">
            </div>
            <div class="bg-dark position-absolute bottom-0 start-0 translate-middle" style="width:30px; height:30px;">
            </div>
            <div class="bg-dark position-absolute bottom-0 start-50 translate-middle" style="width:30px; height:30px;">
            </div>
            <div class="bg-dark position-absolute bottom-0 end-0 translate-middle" style="width:30px; height:30px;">
            </div>

        </div>

    </div>

</body>

</html>
