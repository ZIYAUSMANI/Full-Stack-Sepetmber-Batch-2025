    <input type="text" id="nam" value=""><br><br>
    <button type="button" id="btt">click</button>
    <script>
        btt.onclick = () => {
            let fnamen = frist.value;
            let lnamen = last.value;
            if (m.checked == true)
                nam.value = "mr." + frist.value + last.value
            else if (f.checked == true)
                nam.value = "mrs." + frist.value + last.value
            else if (o.checked == true)
                nam.value = frist.value + last.value
            else
                alert("please enter all information");
        }
    </script>
