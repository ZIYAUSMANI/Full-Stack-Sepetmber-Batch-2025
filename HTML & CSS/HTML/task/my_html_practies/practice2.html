<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <div style="width:200px;height:100px;border:1px solid black;"></div>
    <input type="range" id="rg" min="0" max="100">
    <script>
        rg.onmousemove = () => {
            let box = document.querySelector("div")
            /* box.textContent = rg.value */
            box.style.borderRadius = rg.value + "px";

        }
    </script>
</body>

</html>
