<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <input type="name" id="n1" placeholder="enter name"><br><br>
    <input type="name" id="n2" value=""><br><br>
    <button type="button" id="b">click</button>
    <script>
        b.onclick = () => {
            let n = n1.value
            n2.value = n;
        } 
    </script>
</body>

</html>
