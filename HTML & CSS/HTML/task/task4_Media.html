<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <header>
        <h1>Task - HTML Media Elements & Iframes</h1>
    </header>
    <main>
        <section>
            <h2>image</h2>
            <img src="image/house2.jpg" alt="the house pictuer" height="400" width="500">
        </section>
        <section>
            <h2>audio</h2>
            <audio controls loop muted>
                <source src="mixkit-hip-hop-02-738.mp3" type="audio/mp3">
                <source src="thetestdata-sample.ogg" type="audio/ogg">
                the browser does not support this audio.
            </audio>
        </section>
        <section>
            <h2>videos</h2>
            <video height="300" width="500" controls autoplay loop muted>
                <source src="file_example_MP4_480_1_5MG.mp4" type="video/mp4">
                <source src="big_buck_bunny_240p.ogg" type="video/ogg">
                the browser does not support this video.
            </video>
        </section>
        <section>
            <h2>youtube</h2>
            <iframe width="560" height="315"
                src="https://www.youtube.com/embed/t0Q2otsqC4I?si=Da3AifHg1NzaNl4m&amp;start=80"
                title="YouTube video player" frameborder="0"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
        </section>
        <section>
            <h2>map</h2>
            <iframe
                src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d114487.44794903371!2d72.94797013382772!3d26.270335784450857!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x39418c4eaa06ccb9%3A0x8114ea5b0ae1abb8!2sJodhpur%2C%20Rajasthan!5e0!3m2!1sen!2sin!4v1770192598263!5m2!1sen!2sin"
                width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy"
                referrerpolicy="no-referrer-when-downgrade"></iframe>
        </section>
    </main>
</body>

</html>
