<head>

        .tri {

            width: 0px;
            border-left: 50px solid transparent;

            width: 10px;
            border: 1px solid black;
            margin-top: 10%;
            border-radius: 10px;
        }

        .road {
            height: 400px;
            width: 400px;
            background-image: linear-gradient(to, red 20%, blue 60%, green 90%);
        }
    </style>
</head>

<body>
    <div class="tri">

    </div>
    <div class="box">

    </div>
    <div class="road"></div>
